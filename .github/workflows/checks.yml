name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/build.mjs
          node --check scripts/config.mjs
          node --check ios/scripts/payload.mjs
          node --check ios/scripts/apply-overlay.mjs
      - name: Run packager tests
        run: npm test
      - name: Check assembly script
        run: bash -n scripts/Assemble-iPhomarchy.command
      - name: Check app packaging script
        run: bash -n ios/scripts/package-unsigned.sh
      - name: Check builder help
        run: node scripts/build.mjs --help
